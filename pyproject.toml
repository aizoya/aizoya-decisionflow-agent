[project]
name = "aizoya-decisionflow-agent"
version = "0.1.0"
description = "Autonomous executive action agent built with the Strands Agents SDK"
requires-python = ">=3.11"
dependencies = [
  "strands-agents>=1.0.0",
  "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
